# Конфигурация Nginx для Next.js приложения
# Разместите этот файл в /etc/nginx/sites-available/cozyspace
# И создайте симлинк: sudo ln -s /etc/nginx/sites-available/cozyspace /etc/nginx/sites-enabled/

# HTTP сервер - редирект на HTTPS
server {
    listen 80;
    server_name cozyspace.by www.cozyspace.by;
    
    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    server_name cozyspace.by www.cozyspace.by;

    # SSL сертификаты (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/cozyspace.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cozyspace.by/privkey.pem;

    # SSL настройки безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ВАЖНО: Все запросы к /_next/ должны идти ПЕРЕД основным location /
    # Статические файлы Next.js
    location /_next/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Кэширование статических файлов
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, immutable";
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Основной location для всех остальных запросов
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Блокировка доступа к служебным файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
