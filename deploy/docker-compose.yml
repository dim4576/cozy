# Docker Compose конфигурация
# Использование: docker-compose up -d

version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: cozy-space-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      # Монтирование .env файла (опционально)
      - ../.env:/app/.env:ro
    networks:
      - cozy-network

  nginx:
    image: nginx:alpine
    container_name: cozy-space-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Для SSL сертификатов (раскомментируйте после настройки)
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - cozy-network

networks:
  cozy-network:
    driver: bridge

